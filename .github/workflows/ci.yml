name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/quality.yml
    with:
      playwright_report_name: ci-playwright-report
    permissions:
      contents: read
