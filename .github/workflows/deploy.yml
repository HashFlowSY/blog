name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deployment-config:
    name: Deployment Config
    runs-on: ubuntu-latest
    outputs:
      base-path: ${{ steps.base-path.outputs.base_path }}
    steps:
      - name: Validate required variables
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "::error title=Missing NEXT_PUBLIC_SITE_URL::Set NEXT_PUBLIC_SITE_URL in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
      - name: Determine base path
        id: base-path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
              echo "base_path=" >> "$GITHUB_OUTPUT"
          else
              echo "base_path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    name: Quality Gate
    needs: deployment-config
    uses: ./.github/workflows/quality.yml
    with:
      playwright_report_name: deploy-playwright-report
    permissions:
      contents: read

  build:
    needs: [deployment-config, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.8
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build with Next.js
        run: pnpm build
        env:
          BASE_PATH: ${{ needs.deployment-config.outputs.base-path }}
          NEXT_PUBLIC_BASE_PATH: ${{ needs.deployment-config.outputs.base-path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Verify static asset URLs use the base path
        if: needs.deployment-config.outputs.base-path != ''
        env:
          BASE_PATH: ${{ needs.deployment-config.outputs.base-path }}
        run: |
          if find out -type f -name '*.html' -exec grep -n 'src="/assets/' {} + | grep -q .; then
            echo "::error title=Unprefixed static asset URL::Public assets must include BASE_PATH when deploying to a project site."
            exit 1
          fi
          find out -type f -name '*.html' -exec grep -l "src=\"$BASE_PATH/assets/" {} + | grep -q .
      - name: Install Chromium and WebKit for static artifact verification
        run: pnpm exec playwright install --with-deps chromium webkit
      - id: static-artifact-e2e
        name: Test generated static artifact (Chromium, visual, a11y, WebKit)
        run: pnpm test:e2e:static
        env:
          PLAYWRIGHT_PUBLIC_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          PLAYWRIGHT_STATIC_BASE_URL: http://127.0.0.1:4173${{ needs.deployment-config.outputs.base-path }}/
          STATIC_BASE_PATH: ${{ needs.deployment-config.outputs.base-path }}
      - name: Upload static artifact browser failure report
        if: ${{ failure() && steps.static-artifact-e2e.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deploy-static-artifact-playwright-report
          path: |
            playwright-static-report/
            test-results/static-artifact/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: [deployment-config, quality-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
